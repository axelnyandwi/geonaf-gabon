{
  "name": "offline-tests",
  "on": {
    "push": {
      "branches": [
        "db/d2a-territory-registry",
        "main"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "offline-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "offline": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "env": {
        "PYTHONDONTWRITEBYTECODE": "1",
        "PIP_DISABLE_PIP_VERSION_CHECK": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.13.18"
          }
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "22.14.0"
          }
        },
        {
          "name": "Install existing scientific pins and validation tools",
          "run": "python -m pip install -r requirements-ci-postgis.txt"
        },
        {
          "name": "Offline D3/D5 and Node tests",
          "run": "python -B scripts/ci/offline_validation.py"
        }
      ]
    }
  }
}
