name: demo-pack-linux

# Linux check of the Cloud demo: pinned dependencies, real download of the released
# pack through the GEONAF loader, scientific non-regression on the pack, full suite.
# Test failures are also published as annotations (readable without signing in).
on:
  push:
    # ci/** : temporary validation branches (never deployed: the Cloud app follows deploy/cloud-demo-akanda).
    branches: [deploy/cloud-demo-akanda, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10" "trustme>=1.2,<2"
      - name: Library versions
        run: |
          python - <<'EOF'
          import platform, sys, rasterio, pyproj, numpy, streamlit, psutil
          line = (f"Python {sys.version.split()[0]} | rasterio {rasterio.__version__} GDAL {rasterio.__gdal_version__} "
                  f"PROJ {rasterio.__proj_version__} | pyproj PROJ {pyproj.proj_version_str} | numpy {numpy.__version__} "
                  f"| streamlit {streamlit.__version__} | psutil {psutil.__version__} | {platform.platform()}")
          print(line)
          print(f"::notice title=Versions::{line}")
          EOF
      - name: Download and verify the released pack through the loader
        run: |
          python - <<'EOF'
          import time
          from pathlib import Path
          from src.data.demo_pack import RELEASED_PACK, install_pack
          assert RELEASED_PACK is not None, "RELEASED_PACK non renseigné"
          start = time.perf_counter()
          path, manifest = install_pack(RELEASED_PACK, Path.home() / ".cache" / "geonaf")
          cold = time.perf_counter() - start
          start = time.perf_counter()
          install_pack(RELEASED_PACK, Path.home() / ".cache" / "geonaf")
          warm = time.perf_counter() - start
          print(f"::notice title=Paquet::{manifest['pack_id']} v{manifest['pack_version']} installé en "
                f"{cold:.2f} s ; réutilisation vérifiée en {warm:.2f} s")
          Path("pack_dir.txt").write_text(str(path))
          EOF
      - name: Component comparison with the Windows reference
        if: always()
        run: |
          python scripts/diagnose_pack_science.py "$(cat pack_dir.txt)" --json linux.json > /dev/null
          python - <<'EOF'
          import json
          ref = json.load(open("docs/benchmarks/pack_science_windows_py310.json", encoding="utf-8"))
          cur = json.load(open("linux.json", encoding="utf-8"))
          lines = []
          for name, item in ref["arrays"].items():
              same = item == cur["arrays"][name]
              lines.append(f"{name}: {'identique' if same else 'DIFFÉRENT'}")
          for group in ("statistics", "areas_m2"):
              for key, value in ref[group].items():
                  a, b = value, cur[group][key]
                  if a == b:
                      lines.append(f"{group}.{key}: identique")
                  else:
                      fa, fb = float(a), float(b)
                      rel = abs(fa - fb) / max(abs(fa), 1e-300)
                      lines.append(f"{group}.{key}: {a} -> {b} (écart relatif {rel:.2e})")
          for key in ("comparable_area_m2", "denominator_area_m2", "comparable_coverage_percent"):
              a, b = ref[key], cur[key]
              rel = abs(float(a) - float(b)) / max(abs(float(a)), 1e-300)
              lines.append(f"{key}: {'identique' if a == b else f'{a} -> {b} (écart relatif {rel:.2e})'}")
          lines.append(f"class_pixel_counts: {'identique' if ref['class_pixel_counts'] == cur['class_pixel_counts'] else cur['class_pixel_counts']}")
          lines.append(f"grid: {'identique' if ref['grid'] == cur['grid'] else cur['grid']}")
          print("::notice title=Linux vs Windows::" + "%0A".join(lines))
          EOF
      - name: Scientific non-regression on the pack
        run: >
          GEONAF_DEMO_PACK_DIR="$(cat pack_dir.txt)"
          python -m pytest -q -rs tests/test_demo_pack_science.py --junitxml=science.xml
      - name: Key figures (L2) on the pack against the reference values
        if: always()
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          from src.services.territorial_indicators import compute_territorial_indicators, indicator_inputs
          # Same values and tolerance as tests/test_akanda_territorial_indicators.py (local full data, skipped here).
          expected = {"aoi.area_km2": 144.109, "landcover.land_km2": 107.439, "landcover.vegetation_km2": 82.575,
                      "landcover.builtup_km2": 23.921, "osm.roads_km": 635.285, "osm.buildings_count": 36006,
                      "osm.buildings_footprint_km2": 4.4795}
          result = compute_territorial_indicators(indicator_inputs(Path(open("pack_dir.txt").read().strip()), "akanda"))
          lines, failed = [], False
          for key, reference in expected.items():
              value = result.get(key).value
              ok = value is not None and abs(value - reference) <= 1e-4 * abs(reference)
              failed |= not ok
              lines.append(f"{key}: {value!r} (référence {reference}) {'ok' if ok else 'ÉCART'}")
          print(("::error" if failed else "::notice") + " title=Chiffres clés L2::" + "%0A".join(lines))
          sys.exit(1 if failed else 0)
          EOF
      # --- C2–C5 functional checks (may fail the job) --------------------------------------------------
      - name: C2–C5 targeted tests (errors, shared caches, slots, cgroup, UX, NDVI key proof)
        if: always()
        run: >
          GEONAF_DEMO_PACK_DIR="$(cat pack_dir.txt)"
          python -m pytest -q -rs --junitxml=targeted.xml
          tests/test_ui_errors.py tests/test_bounded_cache.py tests/test_compute_slots.py
          tests/test_shared_results_streamlit.py tests/test_ndvi_cache_independence.py
          tests/test_resource_guards.py tests/test_downloads.py tests/test_ux_home.py
          tests/test_pair_selection_cache.py tests/test_external_sources_fetch.py
      - name: JavaScript tests (map components)
        if: always()
        run: |
          status=0
          for test in tests/frontend/test_*.mjs; do
            node "$test" > "js-$(basename "$test" .mjs).tap" 2>&1 || status=1
            echo "::notice title=$test::$(grep -E '^# (pass|fail)' "js-$(basename "$test" .mjs).tap" | tr '\n' ' ')"
          done
          exit $status
      - name: Streamlit pages on the pack (AppTest, no blocking error)
        if: always()
        run: |
          GABON_GEOAI_DATA_DIR="$(cat pack_dir.txt)" GEONAF_DEMO_PACK=off python - <<'EOF'
          import sys
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py", default_timeout=600).run()
          problems = []
          def check(label):
              errors = [e.value[:200] for e in app.error] + [str(e.message)[:200] for e in app.exception]
              problems.extend(f"{label}: {e}" for e in errors)
              print(f"::notice title={label}::titres={[t.value for t in app.title]} en-têtes={[h.value for h in app.header]} "
                    f"métriques={len(app.metric)} erreurs={len(errors)}")
          check("accueil")
          app.button(key="s2_vegetation_start_akanda").click().run(); check("accueil + L3")
          app.button(key="s2_pairs_start_akanda").click().run(); check("accueil + L4")
          for page in ("pages/1_Acquisitions_Sentinel2.py", "pages/2_Series_NDVI.py", "pages/3_Multisource.py",
                       "pages/4_Territoires.py"):
              app.switch_page(page).run(); check(page)
          for line in problems:
              print(f"::error title=Streamlit::{line}")
          sys.exit(1 if problems else 0)
          EOF
      - name: Streamlit server boot (health endpoint)
        if: always()
        run: |
          GABON_GEOAI_DATA_DIR="$(cat pack_dir.txt)" GEONAF_DEMO_PACK=off \
            python -m streamlit run app.py --server.headless true --server.port 8599 --server.address 127.0.0.1 \
            --browser.gatherUsageStats false > streamlit.log 2>&1 &
          server=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8599/_stcore/health > /dev/null; then
              echo "::notice title=Serveur Streamlit::santé OK après ${attempt} s"; kill "$server"; exit 0
            fi
            sleep 1
          done
          echo "::error title=Serveur Streamlit::pas de réponse santé en 60 s"; tail -40 streamlit.log
          kill "$server" || true; exit 1
      # --- Diagnostics and benchmarks (never fail the job; NOT representative of Streamlit Cloud) ---------
      - name: cgroup memory detection on this runner (diagnostic)
        if: always()
        continue-on-error: true
        run: |
          echo "--- /proc/self/cgroup"; cat /proc/self/cgroup
          echo "--- cgroup mounts"; grep -E ' - cgroup2? ' /proc/self/mountinfo || true
          python - <<'EOF'
          from src.services.resource_guards import available_memory_bytes, cgroup_memory
          figure = cgroup_memory()
          free = available_memory_bytes()
          print(f"::notice title=cgroup (runner GitHub, pas Streamlit Cloud)::{figure} ; mémoire libre retenue par les "
                f"garde-fous : {None if free is None else round(free / 2**20)} Mio")
          EOF
      - name: Memory benchmark with several sessions (indicative only)
        if: always()
        continue-on-error: true
        run: |
          GABON_GEOAI_DATA_DIR="$(cat pack_dir.txt)" GEONAF_DEMO_PACK=off python - <<'EOF'
          # Indicative: a GitHub runner VM, not Streamlit Cloud (other machine, limits and load).
          import threading, time
          from unittest.mock import patch
          import psutil
          from streamlit.testing.v1 import AppTest
          from src.services.bounded_cache import shared_cache
          patch("src.components.resource_panel.available_memory_bytes", lambda: None).start()  # Comparable runs.
          proc, mib = psutil.Process(), 2 ** 20
          rss = lambda: round(proc.memory_info().rss / mib, 1)
          rows = [f"avant le chargement de l'application : {rss()} Mio"]
          peak, stop = [0], threading.Event()
          def sample():
              while not stop.is_set():
                  peak[0] = max(peak[0], proc.memory_info().rss); stop.wait(0.05)
          threading.Thread(target=sample, daemon=True).start()
          sessions = [AppTest.from_file("app.py", default_timeout=600) for _ in range(3)]
          start = time.perf_counter()
          threads = [threading.Thread(target=s.run) for s in sessions]
          [t.start() for t in threads]; [t.join() for t in threads]
          rows.append(f"3 sessions simultanées (caches vides) : {time.perf_counter() - start:.1f} s, "
                      f"RSS {rss()} Mio, pic échantillonné {round(peak[0] / mib, 1)} Mio, "
                      f"erreurs {sum(len(s.error) + len(s.exception) for s in sessions)}")
          extra = AppTest.from_file("app.py", default_timeout=600)
          start = time.perf_counter(); extra.run()
          rows.append(f"4e session (cache partagé) : {time.perf_counter() - start:.1f} s, RSS {rss()} Mio")
          stats = shared_cache().stats()
          rows.append(f"cache partagé : {stats.entries} entrées, {round(stats.retained_bytes / mib, 1)} Mio retenus "
                      f"(budget {round(stats.max_bytes / mib)} Mio)")
          stop.set()
          print("::notice title=Mesures mémoire (indicatives, runner GitHub)::" + "%0A".join(rows))
          EOF
      - name: Full test suite
        if: always()
        run: >
          GEONAF_DEMO_PACK_DIR="$(cat pack_dir.txt)"
          python -m pytest -q -rs --junitxml=suite.xml
      - name: Publish test results as annotations
        if: always()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for report in ("science.xml", "targeted.xml", "suite.xml"):
              if not Path(report).is_file():
                  print(f"::warning title={report}::rapport absent")
                  continue
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "failures", "errors", "skipped")}
              print(f"::notice title={report}::{totals}")
              for case in root.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      text = (problem.get("message", "") + "\n" + (problem.text or ""))[-1800:]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          EOF
