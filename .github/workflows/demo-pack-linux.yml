name: demo-pack-linux

# Linux check of the Cloud demo: pinned dependencies, real download of the released
# pack through the GEONAF loader, scientific non-regression on the pack, full suite.
on:
  push:
    branches: [deploy/cloud-demo-akanda]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10" "trustme>=1.2,<2"
      - name: Library versions
        run: python -c "import sys, rasterio, pyproj; print(sys.version); print('rasterio', rasterio.__version__, 'GDAL', rasterio.__gdal_version__, 'PROJ', rasterio.__proj_version__, '| pyproj PROJ', pyproj.proj_version_str)"
      - name: Download and verify the released pack through the loader
        run: |
          python - <<'EOF'
          import time
          from pathlib import Path
          from src.data.demo_pack import RELEASED_PACK, install_pack
          assert RELEASED_PACK is not None, "RELEASED_PACK non renseigné"
          start = time.perf_counter()
          path, manifest = install_pack(RELEASED_PACK, Path.home() / ".cache" / "geonaf")
          print(f"Paquet {manifest['pack_id']} v{manifest['pack_version']} installé en "
                f"{time.perf_counter() - start:.2f} s")
          start = time.perf_counter()
          install_pack(RELEASED_PACK, Path.home() / ".cache" / "geonaf")
          print(f"Réutilisation vérifiée en {time.perf_counter() - start:.2f} s")
          Path("pack_dir.txt").write_text(str(path))
          EOF
      - name: Scientific non-regression on the pack
        run: GEONAF_DEMO_PACK_DIR="$(cat pack_dir.txt)" python -m pytest -q -rs tests/test_demo_pack_science.py
      - name: Full test suite
        run: GEONAF_DEMO_PACK_DIR="$(cat pack_dir.txt)" python -m pytest -q -rs
