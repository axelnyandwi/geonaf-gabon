# Alembic configuration for GEONAF (D2-a). No database URL here: env.py reads GEONAF_DATABASE_URL.
#   alembic -c db/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
